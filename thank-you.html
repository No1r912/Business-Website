<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thank you for your enquiry to Zyphera Digital.">
  <title>Thank You | Zyphera Digital</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #071a29 0%, #0d2338 100%);
    }

    .success-shell {
      width: min(720px, calc(100vw - 32px));
      padding: clamp(2rem, 4vw, 3rem);
      border: 1px solid rgba(66, 199, 217, 0.2);
      border-radius: 24px;
      background: rgba(12, 24, 38, 0.9);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .success-shell .section-label {
      display: inline-block;
      margin-bottom: 1rem;
    }

    .success-shell h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.2rem, 4vw, 3.3rem);
      line-height: 1.1;
    }

    .success-shell p {
      margin: 0 0 1.5rem;
      color: rgba(255, 255, 255, 0.76);
      line-height: 1.8;
    }

    .success-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <main class="success-shell">
    <span class="section-label">ENQUIRY SENT</span>
    <h1>Thank you for getting in touch.</h1>
    <p>Your enquiry has been submitted successfully. A response will follow as soon as your project or technical requirement has been reviewed.</p>
    <div class="success-actions">
      <a href="index.html#contact" class="btn btn-primary">Back to Contact</a>
      <a href="index.html" class="btn btn-secondary">Return Home</a>
    </div>
  </main>
</body>
</html>
